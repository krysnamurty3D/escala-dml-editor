name: Deploy Firebase (rules + functions)

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "functions/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install functions dependencies
        working-directory: functions
        run: npm install

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Regras primeiro e em passo próprio: uma falha nas Functions (ex: runtime
      # descontinuado) não pode impedir que as regras do Firestore sejam publicadas.
      - name: Deploy das regras do Firestore
        run: npx firebase-tools deploy --only firestore:rules --project escala-dml --force

      - name: Deploy das Functions
        run: npx firebase-tools deploy --only functions --project escala-dml --force
